<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zdieľané predplatné</title>
<style>
  :root{
    --bg:#faf9f5; --card:#ffffff; --border:rgba(0,0,0,0.12); --border2:rgba(0,0,0,0.22);
    --text:#1a1a18; --text2:#6b6a64; --text3:#9a988f;
    --success-bg:#e1f5ee; --success-tx:#0f6e56;
    --accent-bg:#f1efe8; --info-tx:#185fa5;
    --warn-bg:#fbeee0; --warn-tx:#8a5a1a;
  }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); margin:0; padding:24px; line-height:1.6;}
  .wrap{max-width:1100px; margin:0 auto;}
  h1{font-size:22px; font-weight:600; margin:0 0 4px;}
  h3{font-size:16px; font-weight:600; margin:24px 0 12px;}
  .sub{color:var(--text2); font-size:14px; margin-bottom:16px;}
  .status{font-size:13px; padding:8px 12px; border-radius:8px; margin-bottom:16px; display:none;}
  .status.show{display:block;}
  .status.err{background:#fde8e8; color:#9b1c1c;}
  .status.ok{background:var(--success-bg); color:var(--success-tx);}
  .bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:20px;}
  .bar span{font-size:14px; color:var(--text2);}
  select,input,button{font-family:inherit; font-size:14px; padding:7px 10px; border:0.5px solid var(--border2); border-radius:8px; background:var(--card); color:var(--text);}
  button{cursor:pointer; transition:background .12s;}
  button:hover{background:var(--accent-bg);}
  button.primary{background:var(--info-tx); color:#fff; border-color:transparent;}
  button.primary:hover{opacity:0.9; background:var(--info-tx);}
  button.editmode{margin-left:auto;}
  button.editmode.on{background:var(--warn-bg); color:var(--warn-tx); border-color:transparent;}
  .card{background:var(--card); border:0.5px solid var(--border); border-radius:12px; padding:16px 20px; margin-bottom:12px;}
  .chead{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .cname{font-weight:600; font-size:15px;}
  .tag{font-size:11px; font-weight:500; padding:2px 8px; border-radius:20px; vertical-align:middle;}
  .tag.fix{background:#e7eef7; color:var(--info-tx);}
  .tag.lic{background:#f3ebe1; color:#8a5a1a;}
  .meta{font-size:13px; color:var(--text2); margin:6px 0 4px;}
  .meta strong{color:var(--text);}
  table{border-collapse:collapse; font-size:13px;}
  th{font-size:11px; font-weight:400; color:var(--text3); padding:2px; min-width:34px; text-align:center;}
  th.now{color:var(--info-tx); font-weight:600;}
  td{padding:3px; text-align:center;}
  .pname{text-align:left; padding:4px 8px 4px 0; white-space:nowrap; font-size:13px;}
  .pamt{color:var(--text3); font-size:12px;}
  .cnt{color:var(--text3);}
  .chk{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:6px; cursor:pointer; border:0.5px solid var(--border2); user-select:none; font-size:14px;}
  .chk.on{background:var(--success-bg); color:var(--success-tx);}
  .chk.saving{opacity:0.4;}
  .scroll{overflow-x:auto; margin-top:4px;}
  .totals{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
  .tcard{background:var(--accent-bg); border-radius:8px; padding:12px 14px;}
  .tcard .lbl{font-size:13px; color:var(--text2); margin-bottom:2px;}
  .tcard .val{font-size:20px; font-weight:600;}
  .tcard .det{font-size:11px; color:var(--text3); margin-top:3px;}
  .loading{text-align:center; color:var(--text2); padding:40px;}
  .editbtn{font-size:12px; padding:3px 8px; margin-left:4px;}
  .editrow{background:var(--accent-bg); border-radius:8px; padding:10px 12px; margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .editrow input{padding:5px 8px;}
  .editrow .lbl{font-size:12px; color:var(--text2);}
  .addsvc{background:var(--card); border:1px dashed var(--border2); border-radius:12px; padding:16px 20px; margin-bottom:12px;}
  .danger{color:#9b1c1c;}
  .perv{font-size:11px; color:var(--text3); display:block;}
  @media (prefers-color-scheme:dark){
    :root{--bg:#262624;--card:#1f1f1d;--border:rgba(255,255,255,0.14);--border2:rgba(255,255,255,0.24);--text:#f2f1ec;--text2:#a8a69e;--text3:#76746c;--success-bg:#085041;--success-tx:#9fe1cb;--accent-bg:#2c2c2a;--info-tx:#85b7eb;--warn-bg:#3a2c18;--warn-tx:#e0b070;}
    .status.err{background:#4a1515;color:#f8b4b4;}
    .tag.fix{background:#1c2c3e;color:#85b7eb;}
    .tag.lic{background:#3a2c18;color:#e0b070;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Zdieľané predplatné</h1>
  <div class="sub">Spoločný živý prehľad · vždy 12 mesiacov dopredu · odklikni zaplatený mesiac</div>
  <div id="status" class="status"></div>

  <div class="bar">
    <button id="prevBtn">← staršie</button>
    <span id="rangeLabel"></span>
    <button id="nextBtn">novšie →</button>
    <button id="todayBtn">dnes</button>
    <button id="reloadBtn">↻ Obnoviť</button>
    <button id="editBtn" class="editmode">✏️ Upraviť</button>
  </div>

  <div id="globalEdit"></div>
  <div id="services"><div class="loading">Načítavam dáta…</div></div>
  <div id="addServiceBox"></div>

  <h3>Mesačný súčet na osobu</h3>
  <div class="totals" id="totals"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://rylerqcsihuftyejwxhz.supabase.co";
const SUPABASE_KEY = "sb_publishable_-JdT9Ve8eHtlwM5RAz1vXA_b2vcu150";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MONTHS = ["jan","feb","mar","apr","máj","jún","júl","aug","sep","okt","nov","dec"];
const HORIZON = 12; // koľko mesiacov dopredu držať
let rows = [];
let viewOffset = 0; // 0 = od aktuálneho mesiaca; záporné = staršie
let editMode=false;

const now = new Date();
const CUR_Y = now.getFullYear();
const CUR_M = now.getMonth();

function setStatus(msg, type){
  const el=document.getElementById("status");
  if(!msg){ el.className="status"; el.textContent=""; return; }
  el.className="status show "+type; el.textContent=msg;
}
function eur(n){ return n.toLocaleString("sk-SK",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
function ymKey(d){ const dt=new Date(d); return dt.getFullYear()+"-"+dt.getMonth(); }
function keyFromYM(y,m){ return y+"-"+m; }
function ymdFromYM(y,m){ return y+"-"+String(m+1).padStart(2,"0")+"-01"; }
function curKey(){ return keyFromYM(CUR_Y,CUR_M); }

// vráti pole {key,label,y,m,isNow} pre zobrazené okno (12 mes. od akt.+offset)
function monthKeys(){
  const keys=[];
  let y=CUR_Y, m=CUR_M + viewOffset;
  while(m<0){ m+=12; y--; } while(m>11){ m-=12; y++; }
  for(let i=0;i<HORIZON;i++){
    keys.push({key:keyFromYM(y,m), label:(m+1)+"/"+String(y).slice(2), y, m, isNow:(y===CUR_Y&&m===CUR_M)});
    m++; if(m>11){m=0;y++;}
  }
  return keys;
}

async function loadData(){
  setStatus("Načítavam…","ok");
  const {data, error} = await sb.from("platby").select("*").order("mesiac");
  if(error){ setStatus("Chyba pri načítaní: "+error.message,"err"); return; }
  rows = data || [];
  await autoFillMonths();   // doplní chýbajúce mesiace dopredu
  setStatus("",null);
  render();
}

// Auto-doplnenie: pre každú službu zabezpeč, že existuje HORIZON mesiacov od aktuálneho
async function autoFillMonths(){
  if(rows.length===0) return;
  const services=[...new Set(rows.map(r=>r.sluzba))];
  const needed=[];
  for(let i=0;i<HORIZON;i++){
    let y=CUR_Y, m=CUR_M+i; while(m>11){m-=12;y++;}
    needed.push(ymdFromYM(y,m));
  }
  const newRows=[];
  services.forEach(svc=>{
    const svcRows=rows.filter(r=>r.sluzba===svc);
    const existing=new Set(svcRows.map(r=>r.mesiac));
    const lastMonth=[...new Set(svcRows.map(r=>r.mesiac))].sort().pop();
    const template=svcRows.filter(r=>r.mesiac===lastMonth);
    needed.forEach(dateStr=>{
      if(!existing.has(dateStr)){
        template.forEach(r=>{
          newRows.push({sluzba:r.sluzba, platca:r.platca, mesiac:dateStr, suma:0, podiely:r.podiely,
            typ:r.typ, cena_celkom:r.cena_celkom, cena_podiel:r.cena_podiel, zaplatene:false});
        });
      }
    });
  });
  if(newRows.length>0){
    const {error}=await sb.from("platby").insert(newRows);
    if(!error){
      const {data}=await sb.from("platby").select("*").order("mesiac");
      rows=data||rows;
    }
  }
}

function rowAmount(row){
  if(row.typ==="lic"){
    return Number(row.cena_podiel)*(row.podiely||1);
  } else {
    const mk=ymKey(row.mesiac);
    const sameMonth=rows.filter(r=>r.sluzba===row.sluzba && ymKey(r.mesiac)===mk);
    const totalShares=sameMonth.reduce((a,r)=>a+(r.podiely||1),0)||1;
    const total=Number(row.cena_celkom)||0;
    return total/totalShares*(row.podiely||1);
  }
}

function render(){
  const mk=monthKeys();
  document.getElementById("rangeLabel").textContent = `${mk[0].label} – ${mk[mk.length-1].label}`;
  const wrap=document.getElementById("services"); wrap.innerHTML="";
  const services=[...new Set(rows.map(r=>r.sluzba))];
  if(services.length===0 && !editMode){ wrap.innerHTML='<div class="loading">Žiadne platby v databáze.</div>'; }

  services.forEach(svc=>{
    const svcRows=rows.filter(r=>r.sluzba===svc);
    const people=[...new Set(svcRows.map(r=>r.platca))];
    const type=svcRows[0].typ || "fix";

    const firstM = mk.find(m=>svcRows.some(r=>ymKey(r.mesiac)===m.key)) || mk[0];
    const monthRows = svcRows.filter(r=>ymKey(r.mesiac)===firstM.key);
    const totalShares = monthRows.reduce((a,r)=>a+(r.podiely||1),0)||1;

    let metaLine;
    if(type==="fix"){
      const total=Number(monthRows[0]?.cena_celkom)||0;
      const perShare=total/totalShares;
      metaLine = `<span class="tag fix">pevná cena</span>
        <div class="meta">Celkom <strong>${eur(total)}</strong>/mes. · ${firstM.label}: ${totalShares} podielov = <strong>${eur(perShare)}</strong>/podiel <span class="perv">(cena na osobu sa mení podľa počtu ľudí v danom mesiaci)</span></div>`;
    } else {
      const unit=Number(monthRows[0]?.cena_podiel)||0;
      metaLine = `<span class="tag lic">za licenciu</span>
        <div class="meta"><strong>${eur(unit)}</strong>/licenciu · ${firstM.label}: ${totalShares} licencií = <strong>${eur(unit*totalShares)}</strong> spolu</div>`;
    }

    const card=document.createElement("div"); card.className="card";
    let editControls = editMode ? `
      <button class="editbtn" data-renamesvc="${svc}">Premenovať</button>
      <button class="editbtn" data-svcsettings="${svc}">Cena/typ</button>
      <button class="editbtn danger" data-delsvc="${svc}">Zmazať službu</button>` : "";

    let trs=people.map(p=>{
      const pRowFirst=monthRows.find(r=>r.platca===p);
      const sh=pRowFirst?(pRowFirst.podiely||1):1;
      const amtFirst=pRowFirst?rowAmount(pRowFirst):0;
      let cells=mk.map(m=>{
        const row=svcRows.find(r=>r.platca===p && ymKey(r.mesiac)===m.key);
        if(!row) return `<td></td>`;
        const on=row.zaplatene;
        const a=rowAmount(row);
        return `<td><span class="chk ${on?'on':''}" data-id="${row.id}" title="${m.label}: ${eur(a)}">${on?'✓':''}</span></td>`;
      }).join("");
      const paid=mk.filter(m=>{const r=svcRows.find(r=>r.platca===p && ymKey(r.mesiac)===m.key); return r&&r.zaplatene;}).length;
      const inRange=mk.filter(m=>svcRows.find(r=>r.platca===p && ymKey(r.mesiac)===m.key)).length;
      const shTxt = sh>1 ? ` ${sh}×` : "";
      const pEdit = editMode ? `<button class="editbtn" data-renameper="${svc}|${p}">✎</button><button class="editbtn danger" data-delper="${svc}|${p}">✕</button>` : "";
      return `<tr><td class="pname">${p}<span class="pamt">${shTxt} · ~${eur(amtFirst)}</span> <span class="cnt">(${paid}/${inRange})</span> ${pEdit}</td>${cells}</tr>`;
    }).join("");
    const header=`<tr><th></th>${mk.map(m=>`<th class="${m.isNow?'now':''}">${m.label}</th>`).join("")}</tr>`;

    let editTools = "";
    if(editMode){
      const fromDefault = mk[0].y+"-"+String(mk[0].m+1).padStart(2,"0");
      editTools = `
        <div class="editrow"><span class="lbl">Pridať osobu:</span>
          <input placeholder="meno" data-addpername="${svc}"/>
          <span class="lbl">podiely</span><input type="number" min="1" value="1" style="width:60px" data-addpersh="${svc}"/>
          <span class="lbl">od</span><input type="month" data-addperfrom="${svc}" value="${fromDefault}" style="width:140px"/>
          <button class="editbtn primary" data-addper="${svc}">Pridať</button>
        </div>`;
    }
    card.innerHTML=`<div class="chead"><span class="cname">${svc}</span>${metaLine}${editControls}</div><div class="scroll"><table>${header}${trs}</table></div>${editTools}`;
    wrap.appendChild(card);
  });

  const box=document.getElementById("addServiceBox");
  if(editMode){
    box.innerHTML=`<div class="addsvc">
      <div class="cname" style="margin-bottom:8px;">Pridať novú službu</div>
      <div class="editrow">
        <input placeholder="názov služby" id="newSvcName" style="min-width:150px"/>
        <select id="newSvcType"><option value="fix">pevná cena</option><option value="lic">za licenciu</option></select>
        <span class="lbl" id="newSvcPriceLbl">celková cena €</span><input type="number" step="0.01" value="0" style="width:90px" id="newSvcUnit"/>
        <input placeholder="osoby cez čiarku" id="newSvcPeople" style="min-width:200px"/>
        <button class="primary" id="newSvcAdd">Vytvoriť</button>
      </div>
      <div class="meta">Vytvorí ${HORIZON} mesiacov dopredu od aktuálneho. Pri pevnej cene zadaj celkovú cenu služby, pri licencii cenu za 1 licenciu.</div>
    </div>`;
    document.getElementById("newSvcAdd").addEventListener("click",addService);
    document.getElementById("newSvcType").addEventListener("change",e=>{
      document.getElementById("newSvcPriceLbl").textContent = e.target.value==="lic" ? "cena/licenciu €" : "celková cena €";
    });
  } else { box.innerHTML=""; }

  bindEvents();
  renderTotals();
}

function bindEvents(){
  const wrap=document.getElementById("services");
  wrap.querySelectorAll("[data-id]").forEach(el=>el.addEventListener("click",()=>{ if(!editMode) toggle(el); }));
  wrap.querySelectorAll("[data-renamesvc]").forEach(el=>el.addEventListener("click",()=>renameService(el.dataset.renamesvc)));
  wrap.querySelectorAll("[data-delsvc]").forEach(el=>el.addEventListener("click",()=>deleteService(el.dataset.delsvc)));
  wrap.querySelectorAll("[data-svcsettings]").forEach(el=>el.addEventListener("click",()=>serviceSettings(el.dataset.svcsettings)));
  wrap.querySelectorAll("[data-renameper]").forEach(el=>el.addEventListener("click",()=>{const[s,p]=el.dataset.renameper.split("|");renamePerson(s,p);}));
  wrap.querySelectorAll("[data-delper]").forEach(el=>el.addEventListener("click",()=>{const[s,p]=el.dataset.delper.split("|");deletePerson(s,p);}));
  wrap.querySelectorAll("[data-addper]").forEach(el=>el.addEventListener("click",()=>addPerson(el.dataset.addper)));
}

async function toggle(el){
  const id=+el.dataset.id;
  const row=rows.find(r=>r.id===id); if(!row) return;
  const newVal=!row.zaplatene;
  el.classList.add("saving");
  const {error}=await sb.from("platby").update({zaplatene:newVal}).eq("id",id);
  el.classList.remove("saving");
  if(error){ setStatus("Nepodarilo sa uložiť: "+error.message,"err"); return; }
  row.zaplatene=newVal; render();
}

async function renameService(svc){
  const name=prompt("Nový názov služby:", svc); if(!name||name===svc) return;
  setStatus("Premenúvam…","ok");
  const {error}=await sb.from("platby").update({sluzba:name}).eq("sluzba",svc);
  if(error){ setStatus("Chyba: "+error.message,"err"); return; }
  await reloadOnly();
}
async function renamePerson(svc,p){
  const name=prompt(`Nové meno (${p}) v službe ${svc}:`, p); if(!name||name===p) return;
  setStatus("Premenúvam…","ok");
  const {error}=await sb.from("platby").update({platca:name}).eq("sluzba",svc).eq("platca",p);
  if(error){ setStatus("Chyba: "+error.message,"err"); return; }
  await reloadOnly();
}
async function deletePerson(svc,p){
  if(!confirm(`Zmazať ${p} zo služby ${svc}?`)) return;
  setStatus("Mažem…","ok");
  const {error}=await sb.from("platby").delete().eq("sluzba",svc).eq("platca",p);
  if(error){ setStatus("Chyba: "+error.message,"err"); return; }
  await reloadOnly();
}
async function deleteService(svc){
  if(!confirm(`Zmazať celú službu ${svc}?`)) return;
  setStatus("Mažem…","ok");
  const {error}=await sb.from("platby").delete().eq("sluzba",svc);
  if(error){ setStatus("Chyba: "+error.message,"err"); return; }
  await reloadOnly();
}
async function serviceSettings(svc){
  const svcRows=rows.filter(r=>r.sluzba===svc);
  const curType=svcRows[0].typ||"fix";
  const t=prompt("Typ — 'fix' (pevná cena za službu) alebo 'lic' (za licenciu):", curType);
  if(t===null) return;
  const typ=(t==="lic")?"lic":"fix";
  const priceLabel = typ==="fix" ? "Celková mesačná cena služby v €:" : "Cena za 1 licenciu v €:";
  const curPrice = typ==="fix" ? (Number(svcRows[0].cena_celkom)||0) : (Number(svcRows[0].cena_podiel)||0);
  const u=prompt(priceLabel, curPrice);
  if(u===null) return;
  const price=parseFloat(u)||0;
  setStatus("Ukladám…","ok");
  const ids=svcRows.map(r=>r.id);
  if(typ==="fix"){
    await sb.from("platby").update({typ:"fix", cena_celkom:price, cena_podiel:0}).in("id",ids);
  } else {
    await sb.from("platby").update({typ:"lic", cena_podiel:price, cena_celkom:0}).in("id",ids);
  }
  await reloadOnly();
}
async function addPerson(svc){
  const name=(document.querySelector(`[data-addpername="${svc}"]`).value||"").trim();
  const sh=Math.max(1,parseInt(document.querySelector(`[data-addpersh="${svc}"]`).value)||1);
  const fromVal=document.querySelector(`[data-addperfrom="${svc}"]`).value;
  if(!name){ setStatus("Zadaj meno.","err"); return; }
  const svcRows=rows.filter(r=>r.sluzba===svc);
  const typ=svcRows[0].typ||"fix";
  const cenaCelkom=Number(svcRows[0].cena_celkom)||0;
  const cenaPodiel=Number(svcRows[0].cena_podiel)||0;
  let months=[...new Set(svcRows.map(r=>r.mesiac))].sort();
  if(fromVal){ const fromDate=fromVal+"-01"; months=months.filter(m=>m>=fromDate); }
  if(months.length===0){ setStatus("Pre zvolené obdobie služba nemá mesiace.","err"); return; }
  const newRows=months.map(m=>({sluzba:svc, platca:name, mesiac:m, suma:0, podiely:sh, typ:typ, cena_celkom:cenaCelkom, cena_podiel:cenaPodiel, zaplatene:false}));
  setStatus("Pridávam…","ok");
  const {error}=await sb.from("platby").insert(newRows);
  if(error){ setStatus("Chyba: "+error.message,"err"); return; }
  await reloadOnly();
}
async function addService(){
  const name=(document.getElementById("newSvcName").value||"").trim();
  const typ=document.getElementById("newSvcType").value;
  const price=parseFloat(document.getElementById("newSvcUnit").value)||0;
  const people=(document.getElementById("newSvcPeople").value||"").split(",").map(s=>s.trim()).filter(Boolean);
  if(!name||people.length===0){ setStatus("Zadaj názov služby aj aspoň jednu osobu.","err"); return; }
  const newRows=[];
  for(let i=0;i<HORIZON;i++){
    let y=CUR_Y, m=CUR_M+i; while(m>11){m-=12;y++;}
    const dateStr=ymdFromYM(y,m);
    people.forEach(p=>{
      newRows.push({sluzba:name, platca:p, mesiac:dateStr, suma:0, podiely:1, typ:typ,
        cena_celkom: typ==="fix"?price:0, cena_podiel: typ==="lic"?price:0, zaplatene:false});
    });
  }
  setStatus("Vytváram službu…","ok");
  const {error}=await sb.from("platby").insert(newRows);
  if(error){ setStatus("Chyba: "+error.message,"err"); return; }
  await reloadOnly();
}

// reload bez auto-fill (po editoch), aby sa nezmazalo to, čo práve robíme
async function reloadOnly(){
  const {data, error} = await sb.from("platby").select("*").order("mesiac");
  if(error){ setStatus("Chyba: "+error.message,"err"); return; }
  rows=data||[]; setStatus("",null); render();
}

function renderTotals(){
  const monthsInDb = new Set(rows.map(r=>ymKey(r.mesiac))).size || 1;
  const byP={};
  rows.forEach(r=>{ byP[r.platca]=(byP[r.platca]||0)+rowAmount(r); });
  const el=document.getElementById("totals"); el.innerHTML="";
  Object.keys(byP).sort().forEach(p=>{
    const monthly=byP[p]/monthsInDb;
    const d=document.createElement("div"); d.className="tcard";
    d.innerHTML=`<div class="lbl">${p}</div><div class="val">~${eur(monthly)}</div><div class="det">priemer/mes. · celkom ${eur(byP[p])}</div>`;
    el.appendChild(d);
  });
}

document.getElementById("prevBtn").addEventListener("click",()=>{viewOffset-=HORIZON; render();});
document.getElementById("nextBtn").addEventListener("click",()=>{viewOffset+=HORIZON; render();});
document.getElementById("todayBtn").addEventListener("click",()=>{viewOffset=0; render();});
document.getElementById("reloadBtn").addEventListener("click",loadData);
document.getElementById("editBtn").addEventListener("click",e=>{
  editMode=!editMode;
  e.target.classList.toggle("on",editMode);
  e.target.textContent = editMode ? "✓ Hotovo" : "✏️ Upraviť";
  render();
});

loadData();
</script>
</body>
</html>
